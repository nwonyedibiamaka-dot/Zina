<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS • Private Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
    
    body { font-family: 'Inter', system-ui, sans-serif; }
    .title { font-family: 'Playfair Display', sans-serif; }

    .glass {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    
    .dark .glass { background: rgba(15, 23, 42, 0.96); }

    /* 3D Card Styles */
    .card-container {
      perspective: 1400px;
      height: 260px;
    }
    
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    
    .card.flipped {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5);
    }
    
    .card-front { background: linear-gradient(135deg, #1e3a8a, #3b82f6, #60a5fa); }
    .card-back { background: linear-gradient(135deg, #1e2937, #334155); transform: rotateY(180deg); }
    
    .visa-logo {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      letter-spacing: -2px;
      color: #fff;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* Form Styles */
    .form-input {
      @apply w-full px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition;
    }

    .form-label {
      @apply block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2;
    }

    /* Transaction History Animations */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .transaction-item {
      animation: slideIn 0.3s ease-out forwards;
    }

    /* Responsive Text Sizes */
    @media (max-width: 768px) {
      .text-4xl { @apply text-2xl; }
      .text-3xl { @apply text-xl; }
      .text-2xl { @apply text-lg; }
    }

    /* Success Toast */
    .toast {
      animation: slideInUp 0.3s ease-out, slideOutUp 0.3s ease-in 3.7s forwards;
    }

    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(100px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideOutUp {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(100px); }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
  <div class="flex h-screen overflow-hidden flex-col lg:flex-row">
    <!-- Sidebar -->
    <div id="sidebar" class="w-72 bg-white dark:bg-slate-900 border-b lg:border-r border-slate-200 dark:border-slate-700 flex flex-col fixed h-auto lg:h-full lg:relative -translate-x-full lg:translate-x-0 z-50 transition-all">
      <div class="p-6 lg:p-10 border-b">
        <div class="flex items-center gap-4">
          <div class="w-12 lg:w-14 h-12 lg:h-14 bg-blue-700 rounded-3xl flex items-center justify-center text-white text-2xl lg:text-4xl font-bold">N</div>
          <span class="text-3xl lg:text-5xl font-bold tracking-tighter text-blue-700 title">NEXUS</span>
        </div>
      </div>
      <div class="flex-1 p-4 lg:p-6 space-y-2">
        <a href="#" class="flex items-center gap-4 px-4 lg:px-6 py-4 lg:py-5 rounded-3xl bg-blue-50 dark:bg-blue-950 text-blue-700 font-medium text-sm lg:text-base"><i class="fa-solid fa-home"></i> Overview</a>
        <a href="#" class="flex items-center gap-4 px-4 lg:px-6 py-4 lg:py-5 rounded-3xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm lg:text-base"><i class="fa-solid fa-credit-card"></i> Cards</a>
        <a href="#" class="flex items-center gap-4 px-4 lg:px-6 py-4 lg:py-5 rounded-3xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm lg:text-base"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transfers</a>
      </div>
      <button onclick="toggleSidebar()" class="lg:hidden w-full p-4 text-center text-slate-600 dark:text-slate-400 border-t hover:bg-slate-100 dark:hover:bg-slate-800">Close</button>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto flex flex-col">
      <nav class="bg-white/95 dark:bg-slate-900/95 border-b px-4 lg:px-12 py-4 lg:py-6 flex justify-between items-center sticky top-0 z-40 backdrop-blur-2xl">
        <div class="flex items-center gap-3 lg:gap-5 min-w-0">
          <button onclick="toggleSidebar()" class="lg:hidden text-2xl"><i class="fa-solid fa-bars"></i></button>
          <h1 class="text-xl lg:text-4xl font-semibold tracking-tighter title truncate">Good morning, Alex</h1>
        </div>
        <div class="flex items-center gap-3 lg:gap-6">
          <button onclick="toggleTheme()" id="theme-toggle" class="w-10 lg:w-12 h-10 lg:h-12 rounded-3xl flex items-center justify-center text-xl lg:text-2xl hover:bg-slate-100 dark:hover:bg-slate-800">🌙</button>
          <button onclick="showTransferModal()" class="bg-blue-700 text-white px-4 lg:px-8 py-3 lg:py-4 rounded-3xl font-semibold flex items-center gap-2 lg:gap-3 text-sm lg:text-base whitespace-nowrap"><i class="fa-solid fa-arrow-right"></i> <span class="hidden sm:inline">Send</span></button>
        </div>
      </nav>

      <div class="p-4 lg:p-12 flex-1">
        <!-- Cards Section -->
        <div class="mb-8 lg:mb-12">
          <h2 class="text-xl lg:text-2xl font-semibold mb-4 lg:mb-8">Your Cards <span class="text-xs lg:text-sm text-slate-500">(Click to flip)</span></h2>
          <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 lg:gap-8"></div>
        </div>

        <!-- Instant Portals -->
        <div class="mb-8 lg:mb-12">
          <h2 class="text-xl lg:text-2xl font-semibold mb-4 lg:mb-8">Instant Transfers</h2>
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 lg:gap-6">
            <div onclick="quickSend('Zelle')" class="glass rounded-2xl lg:rounded-3xl p-4 lg:p-8 text-center cursor-pointer hover:scale-105 transition text-sm lg:text-base">⚡ Zelle®</div>
            <div onclick="quickSend('Cash App')" class="glass rounded-2xl lg:rounded-3xl p-4 lg:p-8 text-center cursor-pointer hover:scale-105 transition text-sm lg:text-base">$ Cash App</div>
            <div onclick="quickSend('Venmo')" class="glass rounded-2xl lg:rounded-3xl p-4 lg:p-8 text-center cursor-pointer hover:scale-105 transition text-sm lg:text-base">💸 Venmo</div>
            <div onclick="quickSend('Apple Pay')" class="glass rounded-2xl lg:rounded-3xl p-4 lg:p-8 text-center cursor-pointer hover:scale-105 transition text-sm lg:text-base"> Apple Pay</div>
            <div onclick="quickSend('PayPal')" class="glass rounded-2xl lg:rounded-3xl p-4 lg:p-8 text-center cursor-pointer hover:scale-105 transition text-sm lg:text-base">P PayPal</div>
          </div>
        </div>

        <!-- Charts and History Grid -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 lg:gap-8">
          <!-- Charts Section -->
          <div class="xl:col-span-7 space-y-4 lg:space-y-8">
            <div class="glass rounded-2xl lg:rounded-3xl p-6 lg:p-10">
              <h3 class="text-lg lg:text-2xl font-semibold mb-4 lg:mb-8">Spending Trends</h3>
              <div class="relative h-64 lg:h-80">
                <canvas id="spendingChart"></canvas>
              </div>
            </div>
            <div class="glass rounded-2xl lg:rounded-3xl p-6 lg:p-10">
              <h3 class="text-lg lg:text-2xl font-semibold mb-4 lg:mb-8">Spending Breakdown</h3>
              <div class="relative h-64 lg:h-80">
                <canvas id="pieChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Transaction History -->
          <div class="xl:col-span-5">
            <div class="glass rounded-2xl lg:rounded-3xl p-6 lg:p-10 h-full">
              <div class="flex items-center justify-between mb-6 lg:mb-8">
                <h3 class="text-lg lg:text-2xl font-semibold">Recent Transactions</h3>
                <a href="#" class="text-blue-600 dark:text-blue-400 text-xs lg:text-sm hover:underline">View All</a>
              </div>
              <div id="transactions-list" class="space-y-3 lg:space-y-4 max-h-96 lg:max-h-full overflow-y-auto">
                <!-- Transactions will be populated here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Transfer Modal -->
  <div id="transfer-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-2xl flex items-center justify-center z-50 p-4">
    <div class="glass max-w-md w-full rounded-3xl p-6 lg:p-12 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl lg:text-3xl font-semibold">New Transfer</h2>
        <button onclick="closeTransferModal()" class="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 text-2xl"><i class="fa-solid fa-times"></i></button>
      </div>

      <form id="transfer-form" onsubmit="handleTransfer(event)" class="space-y-6">
        <!-- Recipient Selection -->
        <div>
          <label class="form-label">Transfer Method</label>
          <select id="transfer-method" class="form-input" required>
            <option value="">Select a method...</option>
            <option value="Zelle">Zelle</option>
            <option value="Cash App">Cash App</option>
            <option value="Venmo">Venmo</option>
            <option value="Apple Pay">Apple Pay</option>
            <option value="PayPal">PayPal</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </div>

        <!-- Recipient Email/Phone -->
        <div>
          <label class="form-label">Recipient Email or Phone</label>
          <input type="text" id="recipient" class="form-input" placeholder="email@example.com or +1 (555) 000-0000" required>
        </div>

        <!-- Amount -->
        <div>
          <label class="form-label">Amount</label>
          <div class="relative">
            <span class="absolute left-5 top-3 text-slate-500 dark:text-slate-400">$</span>
            <input type="number" id="amount" class="form-input pl-8" placeholder="0.00" step="0.01" min="0" required>
          </div>
        </div>

        <!-- Description/Note -->
        <div>
          <label class="form-label">Description (Optional)</label>
          <input type="text" id="description" class="form-input" placeholder="What's this for?">
        </div>

        <!-- From Card Selection -->
        <div>
          <label class="form-label">From Card</label>
          <select id="from-card" class="form-input" required>
            <option value="">Select a card...</option>
            <option value="Visa Debit - 4242">Visa Debit - ••••4242</option>
            <option value="Mastercard Credit - 5353">Mastercard Credit - ••••5353</option>
          </select>
        </div>

        <!-- Terms Checkbox -->
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="terms" class="w-5 h-5 rounded border-slate-300 text-blue-600" required>
          <span class="text-sm text-slate-600 dark:text-slate-400">I agree to transfer terms & conditions</span>
        </label>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-4 lg:py-5 bg-blue-700 hover:bg-blue-800 text-white rounded-3xl text-lg font-semibold transition transform hover:scale-105 active:scale-95">
          Send Securely
        </button>

        <!-- Cancel Button -->
        <button type="button" onclick="closeTransferModal()" class="w-full py-3 lg:py-4 bg-slate-200 dark:bg-slate-700 text-slate-900 dark:text-white rounded-3xl font-semibold transition hover:bg-slate-300 dark:hover:bg-slate-600">
          Cancel
        </button>
      </form>
    </div>
  </div>

  <!-- Success Toast -->
  <div id="success-toast" class="hidden fixed bottom-4 right-4 toast">
    <div class="bg-green-500 text-white px-6 py-4 rounded-2xl flex items-center gap-3 shadow-lg">
      <i class="fa-solid fa-circle-check text-xl"></i>
      <span id="toast-message">Transfer completed successfully!</span>
    </div>
  </div>

  <script>
    // Sample transaction data
    const transactionsData = [
      { id: 1, type: 'sent', name: 'Sarah Johnson', method: 'Zelle', amount: 250, date: '2 hours ago', icon: '⚡' },
      { id: 2, type: 'received', name: 'John Doe', method: 'Venmo', amount: 75, date: '5 hours ago', icon: '💸' },
      { id: 3, type: 'sent', name: 'Coffee Shop', method: 'Apple Pay', amount: 12.50, date: '1 day ago', icon: '' },
      { id: 4, type: 'received', name: 'Freelance Project', method: 'Bank Transfer', amount: 1500, date: '2 days ago', icon: '💰' },
      { id: 5, type: 'sent', name: 'Netflix', method: 'Credit Card', amount: 15.99, date: '3 days ago', icon: '' },
    ];

    const cardsData = [
      {
        type: "Debit",
        brand: "visa",
        number: "4242 4242 4242 4242",
        expiry: "09/28",
        name: "ALEX RIVERA",
        cvv: "424"
      },
      {
        type: "Credit",
        brand: "mastercard",
        number: "5353 5353 5353 5353",
        expiry: "12/27",
        name: "ALEX RIVERA",
        cvv: "535"
      }
    ];

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      
      cardsData.forEach((card, index) => {
        const div = document.createElement('div');
        div.className = `card-container`;
        div.innerHTML = `
          <div class="card" id="card-${index}">
            <!-- Front -->
            <div class="card-front p-6 lg:p-8 text-white flex flex-col justify-between h-full">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-xs lg:text-sm opacity-80">${card.type} Card</p>
                  <p class="text-lg lg:text-xl font-semibold mt-1">NEXUS</p>
                </div>
                ${card.brand === 'visa' ? 
                  `<div class="visa-logo font-black text-3xl lg:text-4xl tracking-tighter">VISA</div>` : 
                  `<div class="text-3xl lg:text-4xl">💳</div>`
                }
              </div>
              
              <div class="mt-6 lg:mt-8">
                <div class="w-12 lg:w-16 h-10 lg:h-12 bg-gradient-to-br from-amber-300 to-yellow-400 rounded-lg flex items-center justify-center text-amber-900 font-bold text-xs shadow-inner">CHIP</div>
              </div>
              
              <div class="mt-auto">
                <p class="text-lg lg:text-2xl tracking-widest font-mono">${card.number}</p>
                <div class="flex justify-between mt-6 lg:mt-8 text-xs lg:text-sm">
                  <div>
                    <p class="opacity-70 text-[10px] lg:text-xs">VALID THRU</p>
                    <p>${card.expiry}</p>
                  </div>
                  <div class="text-right">
                    <p class="opacity-70 text-[10px] lg:text-xs">CARDHOLDER</p>
                    <p class="font-semibold">${card.name}</p>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Back -->
            <div class="card-back p-6 lg:p-8 text-white flex flex-col justify-between">
              <div class="h-10 lg:h-12 bg-black/60 w-full rounded mb-6 lg:mb-8"></div>
              
              <div class="flex justify-end">
                <div class="bg-white/20 px-4 lg:px-6 py-2 lg:py-3 rounded text-xs lg:text-sm font-medium flex items-center gap-2 lg:gap-3">
                  CVV <span class="font-mono tracking-widest">${card.cvv}</span>
                </div>
              </div>
              
              <!-- Mastercard / Visa Logo on Back -->
              <div class="mt-auto flex justify-end">
                ${card.brand === 'mastercard' ? `
                  <div class="flex items-center gap-1">
                    <div class="w-7 lg:w-9 h-7 lg:h-9 bg-red-600 rounded-full"></div>
                    <div class="w-7 lg:w-9 h-7 lg:h-9 bg-yellow-500 rounded-full -ml-4 lg:-ml-5"></div>
                  </div>
                ` : `
                  <div class="visa-logo text-2xl lg:text-3xl font-black tracking-tighter opacity-90">VISA</div>
                `}
              </div>
              
              <p class="text-[8px] lg:text-[10px] text-center mt-6 lg:mt-8 opacity-60">For customer service call 1-800-NEXUS-BANK</p>
            </div>
          </div>
        `;
        
        const cardEl = div.querySelector(`#card-${index}`);
        cardEl.addEventListener('click', () => {
          cardEl.classList.toggle('flipped');
        });
        
        container.appendChild(div);
      });
    }

    function renderTransactions() {
      const container = document.getElementById('transactions-list');
      container.innerHTML = '';
      
      transactionsData.forEach((transaction, index) => {
        const isReceived = transaction.type === 'received';
        const div = document.createElement('div');
        div.style.animationDelay = `${index * 0.05}s`;
        div.className = 'transaction-item p-4 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-between';
        div.innerHTML = `
          <div class="flex items-center gap-4 min-w-0">
            <div class="w-12 h-12 rounded-full ${isReceived ? 'bg-green-100 dark:bg-green-900' : 'bg-blue-100 dark:bg-blue-900'} flex items-center justify-center flex-shrink-0 text-xl">
              ${transaction.icon || (isReceived ? '📥' : '📤')}
            </div>
            <div class="min-w-0 flex-1">
              <p class="font-semibold text-slate-900 dark:text-white truncate text-sm lg:text-base">${transaction.name}</p>
              <p class="text-xs lg:text-sm text-slate-500 dark:text-slate-400">${transaction.method} • ${transaction.date}</p>
            </div>
          </div>
          <div class="flex-shrink-0 text-right">
            <p class="font-bold ${isReceived ? 'text-green-600 dark:text-green-400' : 'text-slate-900 dark:text-white'} text-sm lg:text-base">
              ${isReceived ? '+' : '-'}$${transaction.amount.toFixed(2)}
            </p>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function initCharts() {
      const chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: {
              color: document.documentElement.classList.contains('dark') ? '#e2e8f0' : '#1e293b',
              font: { family: "'Inter', sans-serif", size: 12 }
            }
          }
        },
        scales: {
          x: {
            ticks: { color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b' },
            grid: { color: document.documentElement.classList.contains('dark') ? 'rgba(148, 163, 184, 0.1)' : 'rgba(100, 116, 139, 0.1)' }
          },
          y: {
            ticks: { color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b' },
            grid: { color: document.documentElement.classList.contains('dark') ? 'rgba(148, 163, 184, 0.1)' : 'rgba(100, 116, 139, 0.1)' }
          }
        }
      };

      new Chart(document.getElementById('spendingChart'), {
        type: 'bar',
        data: {
          labels: ['May 5','May 12','May 19','May 26'],
          datasets: [
            { label: 'Spending', data: [980, 1450, 870, 1320], backgroundColor: '#3b82f6', borderRadius: 8 },
            { label: 'Income', data: [2850, 4100, 2950, 3600], backgroundColor: '#22c55e', borderRadius: 8 }
          ]
        },
        options: chartOptions
      });

      new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels: ['Food', 'Shopping', 'Transport', 'Bills', 'Travel'],
          datasets: [{ 
            data: [30,25,20,15,10], 
            backgroundColor: ['#1e40af','#3b82f6','#60a5fa','#93c5fd','#bfdbfe'],
            borderColor: document.documentElement.classList.contains('dark') ? '#0f172a' : '#f8fafc',
            borderWidth: 2
          }]
        },
        options: {
          ...chartOptions,
          cutout: '78%',
          plugins: {
            ...chartOptions.plugins,
            legend: {
              ...chartOptions.plugins.legend,
              position: 'bottom'
            }
          }
        }
      });
    }

    function handleTransfer(event) {
      event.preventDefault();
      
      const method = document.getElementById('transfer-method').value;
      const recipient = document.getElementById('recipient').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const description = document.getElementById('description').value;
      const fromCard = document.getElementById('from-card').value;

      // Validation
      if (!method || !recipient || !amount || !fromCard) {
        showToast('❌ Please fill in all required fields');
        return;
      }

      if (amount <= 0) {
        showToast('❌ Amount must be greater than 0');
        return;
      }

      if (amount > 10000) {
        showToast('❌ Amount exceeds daily transfer limit');
        return;
      }

      // Add transaction to history
      const newTransaction = {
        id: transactionsData.length + 1,
        type: 'sent',
        name: recipient,
        method: method,
        amount: amount,
        date: 'Just now',
        icon: '📤'
      };

      transactionsData.unshift(newTransaction);
      renderTransactions();

      // Close modal and show success
      closeTransferModal();
      showToast(`✅ Transfer of $${amount.toFixed(2)} sent via ${method}!`);

      // Reset form
      document.getElementById('transfer-form').reset();
    }

    function showToast(message) {
      const toast = document.getElementById('success-toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      toast.classList.remove('hidden');
      
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 4000);
    }

    function quickSend(name) {
      document.getElementById('transfer-method').value = name;
      showTransferModal();
    }

    function showTransferModal() {
      document.getElementById('transfer-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeTransferModal() {
      document.getElementById('transfer-modal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeTransferModal();
      }
    });

    // Load theme preference
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    window.onload = () => {
      renderCards();
      renderTransactions();
      initCharts();
      console.log('%cNEXUS — Enhanced 3D Banking Interface ✨', 'color:#1e40af; font-weight:700');
    };
  </script>
</body>
</html>
